<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mehedi Xpress | P50 Image Audit</title><style>body{font:16px system-ui,sans-serif;background:#f4f7fb;color:#123;padding:18px;max-width:900px;margin:auto}button{background:#075eb9;color:white;padding:12px 18px;border:0;border-radius:10px;cursor:pointer}pre{background:white;padding:18px;white-space:pre-wrap;word-break:break-all;border-radius:12px;border:1px solid #dde5ed}p{line-height:1.6}</style></head><body><h1>P50 ছবি ও ফাইল পরীক্ষা</h1><p>এটি শুধুমাত্র ফাইল পাওয়া যাচ্ছে কি না পরীক্ষা করে; Firebase বা অর্ডারের কোনো তথ্য পরিবর্তন করে না।</p><button id="test">Test Assets</button> <button id="copy">Copy Report</button><pre id="out">Test Assets চাপুন।</pre><script>
const out=document.querySelector('#out');let result='';
const required=['index.html','assets/js/p50-image-recovery.js','assets/js/p46-01.js','assets/js/p46-02.js','assets/js/p46-03.js','assets/js/p46-04.js','assets/js/p46-05.js','assets/js/p46-06.js','assets/js/p46-07.js','assets/js/p46-08.js','assets/js/p46-09.js'];
const photos=["assets/images/p46/0821923142cdf5.png", "assets/images/p46/2b50fae6d3961e.jpg", "assets/images/p46/3922a7fb98d044.jpg", "assets/images/p46/3b3f1adabb27cd.jpg", "assets/images/p46/45528086abcea1.svg", "assets/images/p46/467f1e4dc6b325.svg", "assets/images/p46/547ecb5e86f6dd.svg", "assets/images/p46/558e7de579c5ae.svg", "assets/images/p46/5ea9863f48faa8.jpg", "assets/images/p46/6c0f927f0e3f0f.svg", "assets/images/p46/7aaefd9c61cc38.jpg", "assets/images/p46/7fb1630929deee.svg", "assets/images/p46/85adb0c9b2198e.jpg", "assets/images/p46/85e741006c8207.jpg", "assets/images/p46/921eb6bca2b72c.jpg", "assets/images/p46/97870918ffc69a.jpg", "assets/images/p46/9f5dbd04528c8d.svg", "assets/images/p46/9f5e236bc13e1e.jpg", "assets/images/p46/a30a35c0ce3ecd.svg", "assets/images/p46/a56ff1ba724a83.jpg", "assets/images/p46/b56a2342ae5694.svg", "assets/images/p46/d383ba791f064c.svg", "assets/images/p46/dfc4c1c82df114.svg", "assets/images/p46/e4cea61f21ce01.svg", "assets/images/p46/f0a76661e443c5.jpg", "assets/images/p46/f0d76329450d0d.svg", "assets/images/p46/f1dce3f20f683b.svg", "assets/images/p46/f36824968fb096.jpg", "assets/images/p46/f602185960de1b.jpg", "assets/images/p46/f95cceb158a16c.svg", "assets/images/p46/fd83060cb5f039.svg", "assets/images/p46/fe0c0fa80c1afa.jpg"];
function checkImage(url){return new Promise(done=>{const i=new Image();i.onload=()=>done(true);i.onerror=()=>done(false);i.src=url+'?p50='+Date.now()})}
async function test(){out.textContent='পরীক্ষা চলছে...';let lines=[];let ok=0;
for(const url of required){try{const r=await fetch(url+'?p50='+Date.now(),{cache:'no-store'});if(r.ok){ok++;lines.push('OK '+url)}else lines.push('MISSING '+r.status+' '+url)}catch(e){lines.push('NETWORK ERROR '+url)}}
for(const path of photos){let found='';for(const u of [path,path.replace('assets/images/p46/','assets/images/'),path.replace('assets/images/p46/','assets/')]){if(await checkImage(u)){found=u;break}}if(found){ok++;lines.push('OK image '+found)}else lines.push('MISSING image '+path)}
result='Mehedi Xpress P50 File Report\n'+new Date().toLocaleString()+'\n'+ok+'/'+(required.length+photos.length)+' OK\n'+lines.join('\n');out.textContent=result}
document.querySelector('#test').addEventListener('click',test);document.querySelector('#copy').addEventListener('click',()=>{if(!result)return; if(navigator.clipboard?.writeText){navigator.clipboard.writeText(result).then(()=>alert('Copied')).catch(()=>fallback())}else fallback();function fallback(){const x=document.createElement('textarea');x.value=result;document.body.append(x);x.select();document.execCommand('copy');x.remove();alert('Copied')}});
</script></body></html>
