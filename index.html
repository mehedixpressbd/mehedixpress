<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mehedi Xpress | Sports & Fashion</title>

<meta name="description"
content="Mehedi Xpress — Sports, Fashion, Jersey, T-Shirt এবং Custom Printing-এর জন্য আপনার বিশ্বস্ত অনলাইন শপ।">

<style>
:root{
  --brand:#00b8a9;
  --brand-dark:#008f84;
  --brand-light:#e9fffc;
  --blue:#2563eb;
  --dark:#07111f;
  --dark2:#0d1b2f;
  --text:#172033;
  --muted:#64748b;
  --white:#fff;
  --bg:#f5f7fb;
  --card:#fff;
  --border:#e5eaf1;
  --danger:#ef4444;
  --shadow:0 12px 35px rgba(15,23,42,.09);
  --shadow-lg:0 25px 70px rgba(2,8,23,.15);
  --radius:18px;
  --transition:.28s ease;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,"Noto Sans Bengali","SolaimanLipi",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

img{
  max-width:100%;
  display:block;
}

.container{
  width:min(1200px,92%);
  margin:auto;
}

section{
  scroll-margin-top:100px;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  background:#030812;
  color:#cbd5e1;
  font-size:13px;
}

.topbar-inner{
  min-height:36px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.topbar-links{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}

.topbar a:hover{
  color:#fff;
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(7,17,31,.97);
  backdrop-filter:blur(15px);
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.header-main{
  min-height:74px;
  display:flex;
  align-items:center;
  gap:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:max-content;
  color:#fff;
}

.logo img{
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:10px;
  background:transparent;
  box-shadow:none;
}

.logo-text{
  font-size:21px;
  font-weight:900;
  letter-spacing:.2px;
}

.main-nav{
  display:flex;
  align-items:center;
  gap:5px;
  margin-left:auto;
}

.main-nav a{
  color:#dbeafe;
  font-size:14px;
  font-weight:800;
  padding:9px 11px;
  border-radius:9px;
  transition:var(--transition);
}

.main-nav a:hover,
.main-nav a.active{
  background:rgba(255,255,255,.1);
  color:#fff;
}

/* SEARCH */

.search-box{
  display:flex;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
  min-width:280px;
  margin-left:8px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.search-box input{
  flex:1;
  border:0;
  outline:0;
  padding:11px 13px;
  min-width:0;
}

.search-box button{
  width:48px;
  border:0;
  background:var(--brand);
  color:#fff;
  font-size:18px;
}

/* MOBILE MENU */

.menu-btn{
  display:none;
  width:43px;
  height:43px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:22px;
}

/* =========================
   HERO / BANNER SLIDER
========================= */

.hero{
  position:relative;
  min-height:500px;
  overflow:hidden;
  background:var(--dark);
}

.slider{
  position:relative;
  min-height:500px;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  visibility:hidden;
  transform:scale(1.04);
  transition:opacity .7s ease,transform 1s ease;
  background:
    linear-gradient(90deg,rgba(3,8,18,.92),rgba(3,8,18,.55),rgba(3,8,18,.25)),
    url("hero-banner.jpg") center/cover no-repeat;
}

.slide.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
}

.slide:nth-child(2){
  background:
    linear-gradient(90deg,rgba(0,25,32,.92),rgba(0,25,32,.52)),
    url("hero-banner.jpg") center/cover no-repeat;
}

.slide:nth-child(3){
  background:
    linear-gradient(90deg,rgba(15,23,42,.92),rgba(15,23,42,.48)),
    url("hero-banner.jpg") center/cover no-repeat;
}

.slide-content{
  min-height:500px;
  display:flex;
  align-items:center;
}

.hero-copy{
  max-width:700px;
  color:#fff;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:8px 14px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:999px;
  background:rgba(255,255,255,.07);
  backdrop-filter:blur(10px);
  margin-bottom:18px;
  font-size:13px;
  font-weight:800;
}

.hero h1{
  font-size:clamp(38px,6vw,68px);
  line-height:1.08;
  margin-bottom:17px;
}

.hero p{
  max-width:600px;
  color:#e2e8f0;
  font-size:17px;
  margin-bottom:25px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:11px;
  padding:12px 19px;
  font-weight:900;
  transition:transform .25s ease,box-shadow .25s ease;
}

.btn:hover{
  transform:translateY(-3px);
}

.btn-primary{
  background:linear-gradient(135deg,var(--brand),#00d4c2);
  color:#03211e;
  box-shadow:0 10px 25px rgba(0,184,169,.25);
}

.btn-white{
  background:#fff;
  color:#0f172a;
}

.slider-controls{
  position:absolute;
  left:0;
  right:0;
  bottom:24px;
  z-index:5;
}

.slider-controls-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.slider-arrows{
  display:flex;
  gap:8px;
}

.slider-arrow{
  width:40px;
  height:40px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:50%;
  background:rgba(0,0,0,.3);
  color:#fff;
  backdrop-filter:blur(8px);
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:9px;
  height:9px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.45);
}

.dot.active{
  width:26px;
  border-radius:20px;
  background:var(--brand);
}

/* =========================
   QUICK SERVICE BAR
========================= */

.quick-bar{
  margin-top:-30px;
  position:relative;
  z-index:20;
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border-radius:18px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}

.quick-item{
  display:flex;
  align-items:center;
  gap:13px;
  padding:19px;
  border-right:1px solid var(--border);
}

.quick-item:last-child{
  border-right:0;
}

.quick-icon{
  width:48px;
  height:48px;
  flex:0 0 48px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:var(--brand-light);
  font-size:24px;
}

.quick-item strong{
  display:block;
  font-size:14px;
}

.quick-item span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   GENERAL SECTIONS
========================= */

.section{
  padding:75px 0;
}

.section-title{
  text-align:center;
  margin-bottom:38px;
}

.section-title .eyebrow{
  color:var(--brand-dark);
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:1px;
}

.section-title h2{
  font-size:34px;
  line-height:1.2;
  margin:7px 0 8px;
}

.section-title p{
  color:var(--muted);
}

/* =========================
   CATEGORY
========================= */

.category-grid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:14px;
}

.category-card{
  position:relative;
  border:1px solid var(--border);
  background:#fff;
  border-radius:17px;
  padding:18px 10px;
  text-align:center;
  box-shadow:var(--shadow);
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
}

.category-card:hover{
  transform:translateY(-7px) rotateX(2deg);
  border-color:#9de3dd;
  box-shadow:0 20px 45px rgba(0,184,169,.15);
}

.category-icon{
  width:58px;
  height:58px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:17px;
  background:linear-gradient(135deg,#eafffc,#eff6ff);
  font-size:28px;
}

.category-card strong{
  display:block;
  margin-top:11px;
  font-size:14px;
}

.category-card small{
  color:var(--muted);
  font-size:11px;
}

/* =========================
   PRODUCTS
========================= */

.product-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.product-count{
  color:var(--muted);
  font-weight:800;
}

.show-all{
  border:0;
  background:var(--dark);
  color:#fff;
  border-radius:10px;
  padding:10px 16px;
  font-weight:900;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:19px;
}

.product-card{
  position:relative;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:transform .35s ease,box-shadow .35s ease;
}

.product-card:hover{
  transform:translateY(-8px) rotateX(1deg);
  box-shadow:0 25px 55px rgba(15,23,42,.14);
}

.product-placeholder{
  height:230px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 30% 20%,rgba(0,184,169,.16),transparent 35%),
    linear-gradient(135deg,#edf5f7,#eef2ff);
  font-size:54px;
  color:#94a3b8;
}

.product-body{
  padding:17px;
}

.product-category{
  color:var(--brand-dark);
  font-size:11px;
  font-weight:900;
}

.product-name{
  font-size:17px;
  margin:5px 0;
}

.product-price{
  font-size:20px;
  font-weight:900;
  margin:8px 0 13px;
}

.buy-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:11px;
  background:linear-gradient(135deg,var(--blue),var(--brand-dark));
  color:#fff;
  font-weight:900;
}

.products-empty{
  display:none;
  padding:35px;
  text-align:center;
  border:1px dashed #cbd5e1;
  border-radius:15px;
  background:#fff;
  color:var(--muted);
}

/* =========================
   ABOUT
========================= */

.about-wrap{
  display:grid;
  grid-template-columns:1fr 1.2fr;
  gap:35px;
  align-items:center;
}

.about-card{
  position:relative;
  min-height:350px;
  border-radius:25px;
  overflow:hidden;
  background:
    linear-gradient(135deg,rgba(0,184,169,.85),rgba(37,99,235,.78)),
    url("hero-banner.jpg") center/cover;
  box-shadow:var(--shadow-lg);
}

.about-card-content{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:40px;
  color:#fff;
}

.about-card-content h3{
  font-size:34px;
  margin-bottom:10px;
}

.about-text h2{
  font-size:35px;
  margin-bottom:15px;
}

.about-text>p{
  color:var(--muted);
  margin-bottom:20px;
}

.about-points{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.about-point{
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fff;
  box-shadow:var(--shadow);
}

.about-point strong{
  display:block;
  margin-bottom:3px;
}

.about-point span{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   WHY US
========================= */

.why-section{
  background:#eefcf9;
}

.why-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.why-card{
  background:#fff;
  border:1px solid #dcefeb;
  border-radius:18px;
  padding:25px 20px;
  text-align:center;
  box-shadow:var(--shadow);
  transition:.3s ease;
}

.why-card:hover{
  transform:translateY(-8px);
  box-shadow:0 25px 55px rgba(0,184,169,.14);
}

.why-icon{
  width:62px;
  height:62px;
  margin:auto auto 13px;
  display:grid;
  place-items:center;
  border-radius:19px;
  background:var(--brand-light);
  font-size:30px;
}

.why-card h3{
  margin-bottom:6px;
}

.why-card p{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   FAQ
========================= */

.faq-wrap{
  max-width:850px;
  margin:auto;
}

.faq-item{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(15,23,42,.04);
}

.faq-question{
  width:100%;
  border:0;
  background:#fff;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  text-align:left;
  font-weight:900;
  color:var(--text);
}

.faq-plus{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--brand-light);
  color:var(--brand-dark);
  font-size:20px;
  transition:.3s ease;
}

.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}

.faq-answer-inner{
  padding:0 20px 18px;
  color:var(--muted);
}

.faq-item.open .faq-plus{
  transform:rotate(45deg);
}

.faq-item.open .faq-answer{
  max-height:300px;
}

/* =========================
   CONTACT
========================= */

.contact-section{
  background:var(--dark);
  color:#fff;
}

.contact-section .section-title p{
  color:#aebed0;
}

.contact-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.contact-card{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:24px 15px;
  border:1px solid #22344d;
  border-radius:18px;
  background:rgba(255,255,255,.045);
  transition:.3s ease;
}

.contact-card:hover{
  transform:translateY(-7px);
  background:rgba(255,255,255,.08);
}

.contact-icon{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:17px;
  margin-bottom:10px;
  background:rgba(255,255,255,.09);
  font-size:27px;
}

.contact-card h3{
  margin-bottom:4px;
}

.contact-card p,
.contact-card a{
  color:#c7d3e2;
  font-size:13px;
  word-break:break-word;
}

.contact-card a:hover{
  color:#fff;
}

/* =========================
   LOCATION
========================= */

.location-box{
  margin-top:30px;
  padding:25px;
  border:1px solid #22344d;
  border-radius:18px;
  background:rgba(255,255,255,.045);
  text-align:center;
}

.location-box p{
  color:#c7d3e2;
  margin-bottom:15px;
}

.map-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--brand);
  color:#03211e;
  padding:11px 18px;
  border-radius:10px;
  font-weight:900;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#030812;
  color:#94a3b8;
  padding:30px 0;
  text-align:center;
  font-size:13px;
}

.footer-brand{
  color:#fff;
  font-size:19px;
  font-weight:900;
  margin-bottom:5px;
}

/* =========================
   FLOATING CONTACT
========================= */

.floating-contact{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:1500;
}

.floating-main{
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,var(--brand),#00d4c2);
  color:#03211e;
  font-size:24px;
  box-shadow:0 12px 30px rgba(0,184,169,.35);
  transition:.3s ease;
}

.floating-main:hover{
  transform:scale(1.08) rotate(8deg);
}

.floating-links{
  position:absolute;
  right:4px;
  bottom:68px;
  display:flex;
  flex-direction:column;
  gap:9px;
  opacity:0;
  visibility:hidden;
  transform:translateY(15px);
  transition:.3s ease;
}

.floating-contact.open .floating-links{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.floating-link{
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#fff;
  color:var(--dark);
  box-shadow:0 10px 25px rgba(0,0,0,.18);
  font-size:19px;
  transition:.25s ease;
}

.floating-link:hover{
  transform:scale(1.12);
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:3000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(2,6,23,.78);
  backdrop-filter:blur(5px);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(650px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 30px 100px rgba(0,0,0,.45);
  animation:modalIn .3s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#eef2f7;
  font-size:23px;
}

.order-summary{
  padding:15px;
  border:1px solid #dce8ef;
  border-radius:13px;
  background:#f5fafc;
  margin-bottom:17px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

.form-group label{
  font-size:13px;
  font-weight:900;
}

.form-group input,
.form-group select,
.form-group textarea{
  margin-top:5px;
  width:100%;
  padding:11px 12px;
  border:1px solid #d6dee9;
  border-radius:10px;
  outline:none;
}

.form-group textarea{
  min-height:85px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(0,184,169,.1);
}

.delivery-info{
  margin-top:13px;
  padding:12px;
  border-radius:10px;
  background:#effcf9;
  color:#0f766e;
  font-size:13px;
}

.submit-order{
  width:100%;
  margin-top:14px;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#128c7e
