<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mehedi Xpress BD</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    .hero {
      padding: 70px 5%;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      border-radius: 6px;
    }

    .products {
      padding: 40px 5%;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 180px;
      background: #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Mehedi Xpress BD</div>

    <nav>
      <a href="#">হোম</a>
      <a href="#products">পণ্য</a>
      <a href="#contact">যোগাযোগ</a>
    </nav>
  </header>

  <section class="hero">
    <h1>স্বাগতম Mehedi Xpress BD</h1>
    <p>আপনার পছন্দের পণ্য সহজে অর্ডার করুন</p>
    <a href="#products" class="btn">পণ্য দেখুন</a>
  </section>

  <section class="products" id="products">
    <h2>আমাদের পণ্য</h2>

    <div class="product-container">

      <div class="product">
        <div class="product-image">
          Product Image
        </div>

        <h3>পণ্যের নাম</h3>
        <p class="price">৳ ৫০০</p>

        <a href="#" class="btn">অর্ডার করুন</a>
      </div>

      <div class="product">
        <div class="product-image">
          Product Image
        </div>

        <h3>পণ্যের নাম</h3>
        <p class="price">৳ ৭৫০</p>

        <a href="#" class="btn">অর্ডার করুন</a>
      </div>

    </div>
  </section>

  <footer id="contact">
    <p>© 2026 Mehedi Xpress BD</p>
    <p>সকল অধিকার সংরক্ষিত</p>
  </footer>

</body>
</html>
